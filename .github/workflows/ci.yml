name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        browser: [chromium, firefox]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm exec -- playwright install --with-deps

      - name: Run Tests
        run: npm run test-browser -- --browser.name=${{ env.BROWSER }} --browser.headless --coverage
        env:
          BROWSER: ${{ matrix.browser }}

      - name: Codecov
        uses: codecov/codecov-action@v4

  build-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run check-types

      - name: Build Project
        run: npm run build
